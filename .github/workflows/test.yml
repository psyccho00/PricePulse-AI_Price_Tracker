name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:     

jobs:
  test:
    runs-on: ubuntu-latest        

    steps:
      
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx python-multipart python-dotenv

      - name: Auth & multi-user isolation tests
        run: python test_auth.py

      - name: Backend API tests
        run: python test_backend_api.py

      - name: Analytics tests
        run: python test_analytics.py

      - name: AI intelligence tests
        run: python test_ai_intelligence.py

      - name: Cross-store comparison tests
        run: python test_comparison.py

      - name: Shopping intelligence tests
        run: python test_shopping_intelligence.py

      - name: Production & scheduler tests
        run: python test_production.py
